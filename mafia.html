<style>

body[data-tab=game] .c[data-tab]:not([data-tab=game]),body[data-tab=talk] .c[data-tab]:not([data-tab=talk]),body[data-tab=look] .c[data-tab]:not([data-tab=look]),body[data-tab=town] .c[data-tab]:not([data-tab=town]),body[data-tab=more] .c[data-tab]:not([data-tab=more]){display:none!important}

body.tx .top{background:#1c1c1e}

.rce{flex:0 0 46px;font-size:1.8rem;height:46px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.22);border-radius:14px;font-weight:900}
.rchip.tm{background:linear-gradient(135deg,#b0264f,#5a1030)}.rchip.tc{background:linear-gradient(135deg,#4c63e0,#2a2f7a)}.rchip.tj{background:linear-gradient(135deg,#8a3fd1,#3b1460)}.rchip.hid{background:#2e2850}.rchip.dead{filter:grayscale(.7)}.rchip.hid~*{display:none}
.fbn{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 5px}.fbn .fc{width:26px;height:30px;background:rgba(255,255,255,.1);border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{background:#2b2549;border-radius:16px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}.cell.tr{border-color:var(--pink)}.cell.wr{border-color:#3ccf9c}
.cell .th{position:relative;height:76px;display:flex;align-items:center;justify-content:center;cursor:pointer}.cell .th svg{max-height:72px;background:none!important}.cell .nw{position:absolute;top:-3px;right:-1px;font-style:normal;font-size:.55rem;font-weight:900;background:var(--pink);color:#fff;padding:1px 5px;border-radius:6px}
.cell .cn{font-size:.74rem;font-weight:700;line-height:1.25;min-height:2.5em;display:flex;align-items:center;justify-content:center;word-break:keep-all}.cell button{padding:7px 4px;font-size:.74rem;width:100%}
.sortb{display:flex;gap:14px;margin:2px 4px 10px}.sortb button{background:none;box-shadow:none;padding:2px 0;color:var(--mut);font-size:.78rem}.sortb button.cur{color:#fff;text-decoration:underline;text-underline-offset:5px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#2b2549;font-weight:800;font-size:.85rem;padding:10px 18px;border-radius:999px;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:nowrap}
.intro{text-align:center}.intro .ie{height:84px;display:flex;align-items:center;justify-content:center;margin:8px 0 14px}.intro p{font-size:.9rem;color:#c8c1e6;line-height:1.7;margin:10px 0 18px;word-break:keep-all}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}.dots i{width:7px;height:7px;border-radius:4px;background:#4a4370}.dots i.on{background:var(--pink);width:18px}
.sh-b .tb td:last-child{color:#ffd86b}
body.tx .nav{background:#1c1c1e}body.tx .nav button{background:none;border:0}
.q{white-space:pre-line;line-height:1.65;font-size:.84rem;color:#d3d9e8}
.role{text-align:center;font-size:1.3rem;font-weight:800;padding:8px}
.d{color:#868e96;text-decoration:line-through}.sm{font-size:.72rem;color:#8d96b0;line-height:1.5}
.fig{transform-box:fill-box;transform-origin:50% 100%}.fig.idle{animation:bob 2.6s ease-in-out infinite}.fig.dead{transform:rotate(86deg);filter:grayscale(1);opacity:.55}.fig.fall{animation:fall .9s ease-out}.fa{animation:fa .6s steps(1) infinite}.fb{animation:fb .6s steps(1) infinite}.glow{animation:gl 1.3s ease-in-out infinite}.em{animation:rise 2.4s linear infinite}.tw{animation:tw 2s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}@keyframes fall{0%{transform:rotate(0);opacity:1;filter:none}35%{transform:rotate(-14deg)}100%{transform:rotate(86deg)}}@keyframes fa{0%{opacity:1}50%{opacity:0}}@keyframes fb{0%{opacity:0}50%{opacity:1}}@keyframes gl{50%{opacity:.65}}@keyframes rise{0%{transform:translate(0,0);opacity:.95}100%{transform:translate(var(--dx),-46px);opacity:0}}@keyframes tw{50%{opacity:.2}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(260%) skewX(-20deg)}}@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes up{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
.sw{width:30px;height:30px;padding:0;border-radius:8px;border:2px solid #555;box-shadow:none}.sw.on{border-color:#ffd43b;box-shadow:0 0 0 2px rgba(255,212,59,.4)}.row2{display:flex;align-items:center;gap:8px;margin:6px 0}.row2>.nm2{flex:1;font-size:.85rem}
/* 로그 타임라인 */
.lg div{font-size:.8rem;line-height:1.55;padding:7px 10px;margin:5px 0;border-left:3px solid #4c5372;background:rgba(255,255,255,.035);border-radius:0 10px 10px 0;animation:pop .3s}
.lg .k{border-color:#fa5252;background:rgba(250,82,82,.08)}.lg .s{border-color:#51cf66;background:rgba(81,207,102,.07)}.lg .j{border-color:#ffa94d;background:rgba(255,169,77,.07)}.lg .n{border-color:#748ffc}.lg .dy{border-color:#ffd43b}.lg .wn{border-color:#ffd43b;background:linear-gradient(90deg,rgba(255,212,59,.22),rgba(255,212,59,.04));font-weight:800;font-size:.9rem}
.more{width:100%;margin-top:6px}
/* 참가자 칩 */
#pl span{border:1px solid rgba(255,255,255,.1)}
/* 내 직업 카드 */
.rc{position:relative;overflow:hidden;text-align:center;border-radius:16px;padding:16px 10px 12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.18);animation:pop .35s}
.rc:after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);animation:shine 4.5s ease-in-out infinite}
.rc.tm{background:radial-gradient(circle at 50% 0,#a51d1d,#3b0b0b 75%);box-shadow:0 0 22px rgba(224,49,49,.35)}

.rc.tj{background:radial-gradient(circle at 50% 0,#7b2fbe,#22093b 75%);box-shadow:0 0 22px rgba(177,151,252,.35)}
.rc.tx{background:radial-gradient(circle at 50% 0,#4a5068,#15182a 75%)}
.rc.dead{filter:grayscale(.75) brightness(.8)}
.rc-e{font-size:3rem;line-height:1.1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}

.rc.hid+.q{filter:blur(7px)}.rc.hid .rc-e,.rc.hid .rc-n,.rc.hid .rc-tm{filter:blur(14px)}
.eye{position:absolute;right:8px;top:8px;z-index:2;padding:5px 8px;font-size:.7rem;border-radius:9px;background:rgba(0,0,0,.4);box-shadow:none}
/* 규칙서 */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,4,10,.72);backdrop-filter:blur(4px);display:none}
.ov.op{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:460px;max-height:90vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#22264a,#0f1124);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:up .28s ease-out}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}

.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.tab{flex:1 0 auto;padding:9px 10px;font-size:.9rem;border-radius:11px}
.sh-b{overflow-y:auto;padding:4px 14px 30px;-webkit-overflow-scrolling:touch}
.stp{display:flex;gap:10px;padding:11px;margin:8px 0;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.stp .no{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:900;color:#fff;background:linear-gradient(180deg,#3a3f62,#262a45);box-shadow:inset 0 0 0 1px rgba(255,212,59,.3)}
.stp b{display:block;font-size:1rem;color:#fff;margin-bottom:2px}.stp p{font-size:.8rem;color:#c8cfe0;line-height:1.6}
.pill{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(255,212,59,.15);color:#ffe08a;margin-left:4px;vertical-align:2px}
.wins{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}
.wins div{text-align:center;padding:10px 6px;border-radius:12px;font-size:.72rem;line-height:1.45;color:#dfe4f0}.wins b{display:block;font-size:1.4rem}
.h2{font-family:'Jua',sans-serif;color:var(--gold);font-size:1rem;margin:16px 0 6px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rcd{position:relative;padding:10px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}

.tb{width:100%;border-collapse:collapse;font-size:.8rem}.tb td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.07)}.tb td:last-child{text-align:right;font-weight:800;color:#ffe08a;white-space:nowrap}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chips span{font-size:.74rem;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}

/* 오라·효과 */
.ar-up{animation:arup 2s linear infinite}.ar-dn{animation:ardn 2s linear infinite}.ar-sp{animation:arsp 1.2s steps(1) infinite}
@keyframes arup{0%{transform:translate(0,0);opacity:0}15%{opacity:.95}100%{transform:translate(var(--dx),-60px);opacity:0}}
@keyframes ardn{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),80px);opacity:0}}
@keyframes arsp{0%,100%{opacity:0}10%,35%{opacity:1}20%{opacity:.15}}
.fa-bounce,.fa-spin,.fa-pulse,.fa-flash,.fa-swing,.fa-soul,.fa-dn,.fa-rocket,.fa-glow,.fa-pop,.ft-pulse,.ft-glow,.ft-flick{transform-box:fill-box;transform-origin:50% 50%}
.fa-bounce{animation:fxb 1s ease-in-out infinite}@keyframes fxb{50%{transform:translateY(-7px)}}
.fa-spin{animation:fxs 1.6s linear infinite}@keyframes fxs{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.fa-pulse{animation:fxp 1.1s ease-in-out infinite}@keyframes fxp{50%{transform:scale(1.3)}}
.fa-flash{animation:fxf 1.3s steps(1) infinite}@keyframes fxf{0%,60%{opacity:1}30%,80%{opacity:.15}}
.fa-swing{transform-origin:50% 100%;animation:fxw 2s ease-in-out infinite}@keyframes fxw{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.fa-soul{animation:fxu 2.8s ease-out infinite}@keyframes fxu{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.fa-dn{animation:fxd 2.4s linear infinite}@keyframes fxd{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(90px);opacity:0}}
.fa-rocket{animation:fxr 2s ease-in infinite}@keyframes fxr{0%{transform:translateY(20px);opacity:0}20%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
.fa-glow{animation:gl 1.6s ease-in-out infinite}.fa-pop{animation:fxo 1.6s ease-in-out infinite}@keyframes fxo{0%,100%{transform:scale(1)}10%{transform:scale(1.35)}20%{transform:scale(1)}}
.ft-pulse{animation:ftp 1.6s ease-in-out infinite}@keyframes ftp{50%{transform:scale(1.12);opacity:.7}}.ft-glow{animation:gl 1.4s ease-in-out infinite}.ft-flick{animation:fxf .9s steps(1) infinite}
.pet-b{animation:bob 1.9s ease-in-out infinite}.pet-f{animation:pfy 1.4s ease-in-out infinite}@keyframes pfy{50%{transform:translateY(-5px)}}
.hx-glow{animation:hg 1.1s ease-in-out infinite}@keyframes hg{50%{filter:brightness(1.6) drop-shadow(0 0 2px #fff);opacity:.85}}

.pl-neon{filter:drop-shadow(0 0 3px #22b8cf);animation:gl 1.6s ease-in-out infinite}.pl-neong{filter:drop-shadow(0 0 3px #40c057)}.pl-flick{animation:plk 1.4s steps(1) infinite}@keyframes plk{0%,70%{opacity:1}35%,85%{opacity:.55}}
/* 상점·랭킹 */
.stage{background:radial-gradient(ellipse at 50% 70%,rgba(255,180,80,.12),rgba(0,0,0,.25) 70%);border-radius:14px;padding:8px 6px 10px;margin:6px 0;border:1px solid rgba(255,255,255,.07)}
.fr{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:5px 0;border-radius:12px;background:rgba(255,255,255,.04)}.fr.me{box-shadow:inset 0 0 0 1px rgba(255,212,59,.4)}.fr .rk{width:26px;text-align:center;font-weight:900}.fr .vv{font-weight:900;color:#ffe08a;min-width:34px;text-align:right}.fr .nm2{flex:1;font-size:.85rem}
.coin{font-weight:900;color:#ffe08a;padding:5px 10px;border-radius:999px;background:rgba(255,212,59,.12);border:1px solid rgba(255,212,59,.25);font-size:.85rem}
.lock{opacity:.5}.tthumb{display:inline-block;min-width:58px;max-width:120px;text-align:center;font-size:.66rem;font-weight:800;color:#8ce99a;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.06)}
.row2 button{padding:8px 10px}

/* 야영지 장면 */
.scene{position:relative;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

const Snd=(()=>{
  let ctx=null,master,bgmBus,sfxBus,rev,revSend,delay,delayFB;

  function init(){

    master=ctx.createGain();master.gain.value=vol.mute?0:1;master.connect(ctx.destination);
    bgmBus=ctx.createGain();sfxBus=ctx.createGain();
    bgmBus.gain.value=vol.bgm*.55;sfxBus.gain.value=vol.sfx*.9;
    // 잔향
    rev=ctx.createConvolver();
    const len=ctx.sampleRate*2.8,buf=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    rev.buffer=buf;
    revSend=ctx.createGain();revSend.gain.value=.55;
    const revOut=ctx.createGain();revOut.gain.value=.7;
    revSend.connect(rev);rev.connect(revOut);revOut.connect(master);
    // 부드러운 에코
    delay=ctx.createDelay(2);delay.delayTime.value=.46;delayFB=ctx.createGain();delayFB.gain.value=.32;
    const dl=ctx.createBiquadFilter();dl.type='lowpass';dl.frequency.value=2400;
    delay.connect(dl);dl.connect(delayFB);delayFB.connect(delay);dl.connect(revSend);
    bgmBus.connect(master);bgmBus.connect(revSend);
    sfxBus.connect(master);
    const sfxRev=ctx.createGain();sfxRev.gain.value=.25;sfxBus.connect(sfxRev);sfxRev.connect(revSend);
    timer=setInterval(tick,90);
  }
  function resume(){if(ctx&&ctx.state!=='running')ctx.resume()}
  function setVol(k,v){vol[k]=v;if(!ctx)return;if(k==='bgm')bgmBus.gain.setTargetAtTime(v*.55,ctx.currentTime,.05);if(k==='sfx')sfxBus.gain.setTargetAtTime(v*.9,ctx.currentTime,.05)}
  function setMute(m){vol.mute=m;if(ctx)master.gain.setTargetAtTime(m?0:1,ctx.currentTime,.05)}

  function env(g,t,a,d,peak,end){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(.0001,end||.0001),t+a+d)}
  function glide(out,f0,f1,t,dur,v,type){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,t,.005,dur,v);o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.05)}
  function bell(out,f,t,dur,v){ // 오르골
    const g=ctx.createGain();env(g,t,.004,dur,v);
